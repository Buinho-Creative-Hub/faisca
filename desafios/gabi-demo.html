<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabi · os 8 estados</title>
<link rel="stylesheet" href="css/faisca.css">
<style>
  body { overflow: auto; display: block; }
  .demo { max-width: 1200px; margin: 0 auto; padding: 32px 20px 48px; }
  .demo h1 { margin: 0 0 6px; font-size: 32px; }
  .demo > p { margin: 0 0 24px; color: var(--cinza); font-size: 17px; }
  .grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .cartao-estado { background: #fff; border: 1px solid var(--linha); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cartao-estado figure { margin: 0; height: 150px; display: flex; align-items: flex-end; justify-content: center; background: var(--parede); }
  .cartao-estado img { max-height: 140px; }
  .cartao-estado h2 { margin: 0; font-size: 18px; }
  .cartao-estado code { font-size: 13px; color: var(--cinza); }
  .cartao-estado .gabi-balao { margin: 0; }
  .cartao-estado .gabi-balao::before, .cartao-estado .gabi-balao::after { display: none; }
  .cartao-estado .gabi-texto { font-size: 16px; }
</style>
</head>
<body>
<main class="demo">
  <h1>Gabi, a capivara da gambiarra</h1>
  <p>Os 8 estados e quando aparecem na Faísca. <a href="index.html">Abrir a Faísca</a></p>
  <div class="grelha" id="grelha"></div>
</main>
<script>
const ESTADOS = [
  ['01_boas_vindas', 'Boas-vindas', 'boas_vindas', 'Ao entrar num desafio.', 'Agora quero um coração a bater! Quando tocares no logotipo, ele bate 4 vezes.'],
  ['02_curiosa', 'Curiosa', 'curiosa', 'Pista de nível 1, convite, «agora experimenta».', 'Hmm… o coração está a mudar tão depressa! Será que conseguimos controlar o tempo?'],
  ['03_a_pensar', 'A pensar', 'a_pensar', 'Blocos no sítio errado, teste que não resultou.', 'Os corações estão fora do logotipo. Quando é que vão bater?'],
  ['04_surpreendida', 'Surpreendida', 'surpreendida', 'Erro inesperado; pedido da gambiarra da Gabi.', 'Tens dois botões A! E o B, fica sem nada?'],
  ['05_a_dar_uma_dica', 'A dar uma dica', 'dica', 'Pistas de nível 2 e 3.', 'Procura um bloco azul que nos deixe esperar um bocadinho entre os desenhos.'],
  ['06_a_celebrar', 'A celebrar', 'celebrar', 'Desafio cumprido; gambiarra reparada.', 'Boa! Agora já consigo ver o coração a bater. Descobriste como controlar o tempo!'],
  ['07_a_incentivar', 'A incentivar', 'incentivar', 'A criança corrigiu sozinha um erro sobre o qual teve pista.', 'Isso! Com a pausa já se vê o coração.'],
  ['08_calma', 'Calma', 'calma', 'Três testes seguidos sem resultado.', 'Respira fundo… Não funcionou à primeira? A mim também não. Queres uma pista?'],
];
const g = document.getElementById('grelha');
for (const [f, nome, chave, quando, exemplo] of ESTADOS) {
  const s = document.createElement('section');
  s.className = "cartao-estado";
  s.innerHTML = `<figure><img src="img/gabi/${f}.png" alt="Gabi ${nome.toLowerCase()}"></figure>
    <h2>${nome} <code>${chave}</code></h2>
    <p style="margin:0;font-size:15px">${quando}</p>
    <div class="gabi-balao"><p class="gabi-texto"></p></div>`;
  s.querySelector('.gabi-texto').textContent = exemplo;
  g.appendChild(s);
}
</script>
</body>
</html>
