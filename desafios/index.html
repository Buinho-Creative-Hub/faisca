<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faísca · Desafios micro:bit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232364ff'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23ffc850'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/faisca.css">
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#2364ff"/><path d="M18 4 8 18h7l-2 10 11-15h-7z" fill="#ffc850"/></svg>
    <span class="marca-nome">Faísca</span>
    <span class="marca-sub">desafios micro:bit</span>
  </div>
  <nav class="caminho" id="caminho" aria-label="Desafios"></nav>
  <div class="ligacao">
    <span class="estado" id="estado" aria-live="polite">micro:bit do ecrã</span>
    <button type="button" class="btn btn-claro" id="btnLigar">Ligar micro:bit</button>
  </div>
</header>

<main class="palco">
  <aside class="lado">
    <section class="missao" aria-labelledby="missaoTitulo">
      <div class="missao-num" id="missaoNum">Desafio 1</div>
      <h1 id="missaoTitulo">Acorda-o</h1>
      <p class="missao-frase" id="missaoFrase"></p>
      <ol class="missao-passos" id="missaoPassos"></ol>
      <div class="missao-material"><span>Precisas de</span> <strong id="missaoMaterial"></strong></div>
    </section>

    <section class="sim" aria-label="micro:bit no ecrã">
      <div class="sim-placa" id="sim"></div>
      <div class="sim-comandos">
        <button type="button" class="btn btn-sim" id="btnAgitar">Agitar</button>
        <button type="button" class="btn btn-sim" id="btnAB">A+B</button>
        <button type="button" class="btn btn-sim" id="btnLuz" hidden>Apagar a luz</button>
        <button type="button" class="btn btn-sim btn-recomecar" id="btnRecomecar" title="Recomeçar o programa">Recomeçar</button>
      </div>
    </section>
  </aside>

  <section class="editor" aria-label="Blocos">
    <div class="editor-barra">
      <span class="editor-dica" id="editorDica">Arrasta os blocos da coluna branca para a área cinzenta.</span>
      <button type="button" class="btn btn-texto" id="btnLimparTudo">Começar de novo</button>
    </div>
    <div id="blocos" class="blocos"></div>
  </section>
</main>

<div class="festa" id="festa" hidden>
  <div class="festa-cartao" role="dialog" aria-modal="true" aria-labelledby="festaTitulo">
    <svg viewBox="0 0 120 120" class="festa-estrela" aria-hidden="true"><path d="M60 8l15 33 36 4-27 24 8 36-32-19-32 19 8-36L9 45l36-4z" fill="#ffc850" stroke="#010101" stroke-width="3" stroke-linejoin="round"/></svg>
    <h2 id="festaTitulo">Conseguiste!</h2>
    <p id="festaTexto">Desbloqueaste blocos novos.</p>
    <div class="festa-botoes">
      <button type="button" class="btn btn-texto" id="btnFicar">Ficar aqui</button>
      <button type="button" class="btn btn-escuro" id="btnSeguinte">Desafio seguinte</button>
    </div>
  </div>
</div>

<script src="vendor/blockly_compressed.js"></script>
<script src="vendor/blockly-msg-pt.js"></script>
<script src="js/blocks.js"></script>
<script src="js/sim.js"></script>
<script src="js/motor.js"></script>
<script src="js/ble.js"></script>
<script src="js/desafios.js"></script>
<script src="js/app.js"></script>
</body>
</html>
